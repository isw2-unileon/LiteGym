services:
    postgres-test:
        build:
            context: .
            dockerfile: Dockerfile
        image: gym-postgres-local:15-alpine
        container_name: postgres-test
        environment:
            POSTGRES_USER: test_user
            POSTGRES_PASSWORD: test_password
            POSTGRES_DB: test_db
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
            interval: 5s
            timeout: 5s
            retries: 20
