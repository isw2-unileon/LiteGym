name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/backend.yml"
      - "sql/**"
  pull_request:
    paths:
      - "backend/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/backend.yml"
      - "sql/**"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Show workspace files
        run: |
          pwd
          ls -la
          ls -la sql || true
          ls -la backend/sql || true
          find . -maxdepth 3 -type f | sort

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: test_password
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U test_user -d test_db; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Apply schema
        env:
          PGPASSWORD: test_password
        run: |
          if [ -f ./sql/schema.sql ]; then
            SCHEMA_FILE=./sql/schema.sql
          elif [ -f ./backend/sql/schema.sql ]; then
            SCHEMA_FILE=./backend/sql/schema.sql
          else
            echo "schema.sql not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Applying schema from: $SCHEMA_FILE"
          psql -h localhost -p 5432 -U test_user -d test_db -f "$SCHEMA_FILE"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: .

      - name: Test
        env:
          TEST_DB_URL: postgres://test_user:test_password@localhost:5432/test_db
        run: go test -v -race ./...

      - name: Build
        run: go build -o /dev/null ./backend/cmd/server
